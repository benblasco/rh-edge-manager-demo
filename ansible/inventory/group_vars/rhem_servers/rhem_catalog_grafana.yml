# Grafana quadlet CatalogItem (see README.catalog-quadlet.md and catalog/applications/grafana-demo/).

rhem_catalog_grafana_enabled: true
rhem_catalog_grafana_item_name: grafana-demo
rhem_catalog_grafana_catalog_name: default
