# rhem_catalog_grafana_manifest_src_override: /path/on/controller/catalogitem.yaml
rhem_catalog_grafana_manifest_dest: /etc/flightctl/catalogs/grafana-demo-catalogitem.yaml
rhem_catalog_grafana_force_login: false