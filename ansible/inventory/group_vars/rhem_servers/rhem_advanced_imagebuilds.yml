---
# Advanced bootc build (Containerfile + podman). See README.image-builds-advanced.md.

rhem_advanced_build_name: advancedbuild1
rhem_advanced_build_dir: "/etc/flightctl/advancedbuilds/{{ rhem_advanced_build_name }}"
rhem_advanced_manifest_dir: /etc/flightctl/advancedbuild-manifests
rhem_advanced_manifest_mode: "0600"

rhem_advanced_dest_image: advancedbuild1
rhem_advanced_dest_tag: latest
rhem_advanced_oci_image_ref: "{{ rhem_built_registry_host }}/{{ rhem_advanced_dest_image }}:{{ rhem_advanced_dest_tag }}"

rhem_advanced_early_binding: true
rhem_advanced_containerfile_add_config: "{{ rhem_advanced_early_binding }}"
rhem_advanced_regenerate_enrollment_cert: false
rhem_advanced_enrollment_cert_expiration: 365d

rhem_advanced_extra_packages:
  - tmux
  - bash-completion
  - cockpit

# Software Catalog (direct CatalogItem — no ImagePromotion without ImageBuild)
rhem_advanced_catalog_enabled: true
rhem_advanced_catalog_apply: "{{ rhem_advanced_catalog_enabled }}"
rhem_advanced_catalog_name: default
rhem_advanced_catalog_item_name: "{{ rhem_advanced_dest_image }}"
rhem_advanced_catalog_display_name: Lab RHEL 10 advanced image
rhem_advanced_catalog_item_version: "1.0.0"
rhem_advanced_catalog_channel: testing
rhem_advanced_catalog_category: system

# Long-running podman build (set false for catalog-only re-runs after push)
rhem_advanced_build_async: true
rhem_advanced_build_poll: 60
rhem_advanced_build_async_timeout: 7200