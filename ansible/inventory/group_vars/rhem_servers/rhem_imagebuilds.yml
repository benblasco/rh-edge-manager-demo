---
# Shared registry and bootc defaults (basic + advanced image builds).
# Secrets: vault.yml (rhem_registry_username / rhem_registry_password).

rhem_oci_repo_redhat_name: registry-redhat-io
rhem_oci_repo_built_name: micro-lan-built

rhem_bootc_image_name: rhel10/rhel-bootc
rhem_bootc_image_tag: "1795492183"
rhem_bootc_image_ref: "{{ rhem_registry_url }}/{{ rhem_bootc_image_name }}:{{ rhem_bootc_image_tag }}"

rhem_built_registry_host: micro.lan:5000
rhem_built_registry_scheme: https
rhem_built_registry_skip_tls_verify: true
rhem_built_registry_username: ""
rhem_built_registry_password: ""

rhem_lab_registry_dropin_path: /etc/containers/registries.conf.d/998-micro-lan-lab.conf

# Image builder worker (host play)
rhem_imagebuilder_worker_service: flightctl-imagebuilder-worker.service
rhem_imagebuilder_quadlet_dropin_dir: /etc/containers/systemd/flightctl-imagebuilder-worker.container.d
rhem_imagebuilder_subscription_dropin: subscription.conf
rhem_imagebuilder_rpm_repo_add: false
rhem_imagebuilder_rpm_repo_enable: "{{ rhem_rhsm_repo_id }}"

# Simplified ImageBuild + promotion (API play on localhost)
rhem_imagebuild_name: testbuild1
rhem_imagebuild_dest_image: testbuild1
rhem_imagebuild_dest_tag: latest
rhem_imagebuild_binding: early
# ImagePromotion exportFormats (omit container on lab gateway 1.4.1)
rhem_imagebuild_promotion_export_qcow2: true
rhem_imagebuild_export_formats: >-
  {{ ['qcow2'] if (rhem_imagebuild_promotion_export_qcow2 | bool and rhem_imageexport_enabled | bool) else [] }}

# QCOW2 ImageExport (after ImageBuild completes)
rhem_imageexport_enabled: true
rhem_imageexport_apply: "{{ rhem_imageexport_enabled }}"
rhem_imageexport_name: "{{ rhem_imagebuild_name }}-qcow2"
rhem_imageexport_format: qcow2
rhem_imageexport_wait_complete: true
rhem_imageexport_wait_retries: 180
rhem_imageexport_wait_delay: 10
rhem_imageexport_download_enabled: false
rhem_imageexport_download_path: "./{{ rhem_imagebuild_name }}-disk.qcow2"

rhem_imagebuild_apply_repositories: true
rhem_imagebuild_apply_build: true
rhem_imagebuild_promotion_enabled: true
rhem_imagebuild_apply_promotion: "{{ rhem_imagebuild_promotion_enabled }}"
rhem_imagebuild_wait_complete: true
rhem_imagebuild_wait_retries: 180
rhem_imagebuild_wait_delay: 10

rhem_imagepromotion_name: testbuild1-promotion
rhem_imagepromotion_wait_complete: true
rhem_imagepromotion_wait_retries: 60
rhem_imagepromotion_wait_delay: 10

rhem_catalog_name: default
rhem_catalog_item_name: testbuild1
rhem_catalog_display_name: Lab RHEL 10 early-binding image
rhem_catalog_item_version: "1.0.0"