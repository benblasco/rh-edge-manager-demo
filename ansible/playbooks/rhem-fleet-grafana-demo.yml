---
# Apply lab fleet: testbuild1 OS + grafana-demo quadlet via RHEM API.
# Requires: rhem-install-rpm.yml; catalog items testbuild1 and grafana-demo (see README.fleets-basic.md).
# No enrolled device is required — fleet membership may be empty until devices are labeled.
# Manifest source of truth: fleets/lab-testbuild1-grafana.yaml (repo root); template mirrors it.

- name: Apply lab testbuild1 + Grafana fleet via RHEM API
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  collections:
    - flightctl.core
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_flightctl_connection.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_fleet_grafana.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/vault.yml"
  module_defaults:
    flightctl.core.flightctl_resource:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"
    flightctl.core.flightctl_resource_info:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"

  pre_tasks:
    - name: Skip playbook when fleet apply disabled
      ansible.builtin.meta: end_play
      when: not rhem_fleet_grafana_enabled | bool

    - name: Require vault secret for RHEM API login
      ansible.builtin.assert:
        that:
          - rhem_pam_password is defined
          - rhem_pam_password | length > 0
          - rhem_pam_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_pam_password in inventory/group_vars/rhem_servers/vault.yml
          (see vault.yml.example).
      tags: [always]

  tasks:
    - name: Apply Fleet via gateway REST
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_apply_fleet_rest.yml"
      vars:
        rhem_flightctl_apply_template: "{{ playbook_dir }}/../templates/fleets/lab-testbuild1-grafana.yaml.j2"
        rhem_flightctl_apply_name: "{{ rhem_fleet_grafana_name }}"
      tags: [fleet]

    - name: Verify fleet on gateway
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_verify_fleet_rest.yml"
      tags: [verify, fleet]

    - name: Summarise fleet apply
      ansible.builtin.debug:
        msg:
          - "Fleet: {{ rhem_fleet_grafana_name }}"
          - "Selector: {{ rhem_fleet_grafana_selector_label_key }}={{ rhem_fleet_grafana_selector_label_value }}"
          - "Static manifest: fleets/lab-testbuild1-grafana.yaml"
          - "Devices with label (expect empty until Phase B): flightctl get devices -l '{{ rhem_fleet_grafana_selector_label_key }}={{ rhem_fleet_grafana_selector_label_value }}'"
          - "UI: https://{{ rhem_fqdn }}/"
      tags: [verify]