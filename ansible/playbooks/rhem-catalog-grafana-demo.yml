---
# Publish Grafana quadlet CatalogItem to the default Software Catalog.
# Requires: rhem-install-rpm.yml (flightctl-cli, gateway, PAM user).
# Manifest source of truth: catalog/applications/grafana-demo/catalogitem.yaml (repo root).

- name: Register Grafana demo in RHEM Software Catalog
  hosts: rhem_servers
  become: true
  gather_facts: true
  vars:
    rhem_catalog_grafana_manifest_src: "{{ rhem_catalog_grafana_manifest_src_override | default(playbook_dir ~ '/../../catalog/applications/grafana-demo/catalogitem.yaml', true) }}"

  pre_tasks:
    - name: Skip playbook when catalog apply disabled
      ansible.builtin.meta: end_play
      when: not rhem_catalog_grafana_enabled | bool

    - name: Require vault secrets for flightctl login
      ansible.builtin.assert:
        that:
          - rhem_pam_password is defined
          - rhem_pam_password | length > 0
          - rhem_pam_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_pam_password in inventory/group_vars/rhem_servers/vault.yml
          (see vault.yml.example).
      when: rhem_flightctl_login_enabled | bool
      tags: [always]

  tasks:
    - name: Assert catalog manifest exists on controller
      ansible.builtin.stat:
        path: "{{ rhem_catalog_grafana_manifest_src }}"
      register: rhem_catalog_grafana_manifest_stat
      delegate_to: localhost
      become: false
      tags: [catalog]

    - name: Require catalog manifest file
      ansible.builtin.assert:
        that:
          - rhem_catalog_grafana_manifest_stat.stat.exists
        fail_msg: >-
          Missing {{ rhem_catalog_grafana_manifest_src }}.
          Run from repo checkout with catalog/applications/grafana-demo/catalogitem.yaml present.
      tags: [catalog]

    - name: Ensure flightctl CLI package is installed
      ansible.builtin.dnf:
        name: "{{ rhem_package_cli }}"
        state: present
      tags: [catalog]

    - name: Ensure catalog staging directory exists
      ansible.builtin.file:
        path: "{{ rhem_catalog_grafana_manifest_dest | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [catalog]

    - name: Check for existing flightctl client configuration
      ansible.builtin.stat:
        path: "{{ rhem_flightctl_client_config }}"
      register: rhem_flightctl_client_stat
      when: rhem_flightctl_login_enabled | bool
      tags: [catalog]

    - name: Build flightctl login argument list
      ansible.builtin.set_fact:
        rhem_flightctl_login_argv: >-
          {{ _rhem_flightctl_login_base + (['--insecure-skip-tls-verify'] if rhem_flightctl_login_insecure_tls | bool else []) }}
      vars:
        _rhem_flightctl_login_base:
          - flightctl
          - login
          - "https://{{ rhem_fqdn }}"
          - --username
          - "{{ rhem_pam_username }}"
          - --password
          - "{{ rhem_pam_password }}"
      when: rhem_flightctl_login_enabled | bool
      no_log: true
      tags: [catalog]

    - name: Log in flightctl CLI on RHEM host
      ansible.builtin.command:
        argv: "{{ rhem_flightctl_login_argv }}"
      when:
        - rhem_flightctl_login_enabled | bool
        - rhem_catalog_grafana_force_login | bool or not rhem_flightctl_client_stat.stat.exists | default(false)
      no_log: true
      tags: [catalog]

    - name: Copy Grafana catalog item manifest to RHEM host
      ansible.builtin.copy:
        src: "{{ rhem_catalog_grafana_manifest_src }}"
        dest: "{{ rhem_catalog_grafana_manifest_dest }}"
        owner: root
        group: root
        mode: "0644"
      tags: [catalog]

    - name: Confirm default catalog exists
      ansible.builtin.command:
        argv:
          - flightctl
          - get
          - catalog/{{ rhem_catalog_grafana_catalog_name }}
      register: rhem_catalog_get_default
      changed_when: false
      tags: [catalog]

    - name: Apply Grafana catalog item
      ansible.builtin.command:
        argv:
          - flightctl
          - apply
          - -f
          - "{{ rhem_catalog_grafana_manifest_dest }}"
      register: rhem_catalog_grafana_apply
      changed_when: rhem_catalog_grafana_apply.rc == 0
      tags: [catalog]

    - name: Query SELinux mode
      ansible.builtin.command:
        cmd: getenforce
      register: rhem_getenforce
      changed_when: false
      tags: [verify]

    - name: Assert SELinux is enforcing when required
      ansible.builtin.assert:
        that:
          - not rhem_verify_selinux_enforcing | bool or rhem_getenforce.stdout == 'Enforcing'
        fail_msg: "SELinux is {{ rhem_getenforce.stdout }}; this demo expects Enforcing."
      tags: [verify]

    - name: Verify flightctl-cli package
      ansible.builtin.command:
        cmd: dnf list installed flightctl-cli
      register: rhem_flightctl_cli_dnf
      changed_when: false
      tags: [verify]

    - name: Verify Grafana catalog item
      ansible.builtin.command:
        argv:
          - flightctl
          - get
          - catalogitem/{{ rhem_catalog_grafana_item_name }}
          - --catalog
          - "{{ rhem_catalog_grafana_catalog_name }}"
      register: rhem_catalog_grafana_get
      changed_when: false
      tags: [verify]

    - name: List catalog items in default catalog
      ansible.builtin.command:
        argv:
          - flightctl
          - get
          - catalogitems
          - --catalog
          - "{{ rhem_catalog_grafana_catalog_name }}"
      register: rhem_catalog_items_list
      changed_when: false
      tags: [verify]

    - name: Summarise catalog registration
      ansible.builtin.debug:
        msg:
          - "Catalog item: {{ rhem_catalog_grafana_item_name }} (catalog {{ rhem_catalog_grafana_catalog_name }})"
          - "Manifest on host: {{ rhem_catalog_grafana_manifest_dest }}"
          - "UI: https://{{ rhem_fqdn }}/ — Software Catalog"
          - "SELinux: {{ rhem_getenforce.stdout }}"
      tags: [verify]