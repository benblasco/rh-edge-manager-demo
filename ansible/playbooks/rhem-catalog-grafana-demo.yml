---
# Publish Grafana quadlet CatalogItem to the default Software Catalog via RHEM API.
# Requires: rhem-install-rpm.yml (gateway reachable); flightctl.core on the controller.
# Manifest source of truth: catalog/applications/grafana-demo/catalogitem.yaml (repo root).

- name: Register Grafana demo in RHEM Software Catalog
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  collections:
    - flightctl.core
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_flightctl_connection.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_catalog_grafana.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/vault.yml"
  vars:
    rhem_catalog_grafana_manifest_src: >-
      {{ rhem_catalog_grafana_manifest_src_override
         | default(playbook_dir ~ '/../../catalog/applications/grafana-demo/catalogitem.yaml', true) }}
  module_defaults:
    flightctl.core.flightctl_resource:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"
    flightctl.core.flightctl_resource_info:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"

  pre_tasks:
    - name: Skip playbook when catalog apply disabled
      ansible.builtin.meta: end_play
      when: not rhem_catalog_grafana_enabled | bool

    - name: Require vault secret for RHEM API login
      ansible.builtin.assert:
        that:
          - rhem_pam_password is defined
          - rhem_pam_password | length > 0
          - rhem_pam_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_pam_password in inventory/group_vars/rhem_servers/vault.yml
          (see vault.yml.example).
      tags: [always]

  tasks:
    - name: Assert catalog manifest exists on controller
      ansible.builtin.stat:
        path: "{{ rhem_catalog_grafana_manifest_src }}"
      register: rhem_catalog_grafana_manifest_stat
      tags: [catalog]

    - name: Require catalog manifest file
      ansible.builtin.assert:
        that:
          - rhem_catalog_grafana_manifest_stat.stat.exists
        fail_msg: >-
          Missing {{ rhem_catalog_grafana_manifest_src }}.
          Run from repo checkout with catalog/applications/grafana-demo/catalogitem.yaml present.
      tags: [catalog]

    - name: Ensure Grafana quadlet CatalogItem is present
      flightctl.core.flightctl_resource:
        kind: CatalogItem
        name: "{{ rhem_catalog_grafana_item_name }}"
        catalog_name: "{{ rhem_catalog_grafana_catalog_name }}"
        state: present
        resource_definition: "{{ lookup('file', rhem_catalog_grafana_manifest_src) | from_yaml }}"
      no_log: true
      tags: [catalog]

    - name: Get Grafana catalog item
      flightctl.core.flightctl_resource_info:
        kind: CatalogItem
        catalog_name: "{{ rhem_catalog_grafana_catalog_name }}"
        name: "{{ rhem_catalog_grafana_item_name }}"
      register: grafana_catalog_item
      tags: [verify, catalog]

    - name: Summarise catalog registration
      ansible.builtin.debug:
        msg:
          - "Catalog item: {{ rhem_catalog_grafana_item_name }} (catalog {{ rhem_catalog_grafana_catalog_name }})"
          - "Manifest source: {{ rhem_catalog_grafana_manifest_src }}"
          - "UI: https://{{ rhem_fqdn }}/ — Software Catalog"
          - "API changed: see flightctl_resource task result"
      tags: [verify]