---
# Simplified ImageBuild worker, OCI repositories, build, and Software Catalog promotion.
# Host play: image builder worker. API play (localhost): flightctl.core modules — no flightctl apply.
# Prerequisites: playbooks/rhem-install-rpm.yml on the same inventory.

- name: Configure RHEM image builder worker
  hosts: rhem_servers
  become: true
  gather_facts: false

  handlers:
    - name: Restart image builder worker
      ansible.builtin.systemd:
        name: "{{ rhem_imagebuilder_worker_service }}"
        state: restarted
        daemon_reload: true

    - name: Restart flightctl target after imagebuilderWorker config change
      ansible.builtin.systemd:
        name: "{{ rhem_systemd_target }}"
        state: restarted
        daemon_reload: true

  tasks:
    - name: Ensure image builder worker quadlet drop-in directory exists
      ansible.builtin.file:
        path: "{{ rhem_imagebuilder_quadlet_dropin_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [worker]

    - name: Install subscription mounts drop-in for image builder worker
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/imagebuilder-worker-subscription.conf"
        dest: "{{ rhem_imagebuilder_quadlet_dropin_dir }}/{{ rhem_imagebuilder_subscription_dropin }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart image builder worker
      tags: [worker]

    - name: Configure imagebuilderWorker in flightctl service configuration
      ansible.builtin.blockinfile:
        path: "{{ rhem_service_config_path }}"
        marker: "# {mark} ANSIBLE MANAGED imagebuilderWorker"
        block: |
          imagebuilderWorker:
            rpmRepoAdd: {{ rhem_imagebuilder_rpm_repo_add | bool | lower }}
            rpmRepoEnable: {{ rhem_imagebuilder_rpm_repo_enable }}
      notify:
        - Restart flightctl target after imagebuilderWorker config change
        - Restart image builder worker
      tags: [worker]

    - name: Apply service configuration handlers before starting worker
      ansible.builtin.meta: flush_handlers
      tags: [worker]

    - name: Enable and start image builder worker
      ansible.builtin.systemd:
        name: "{{ rhem_imagebuilder_worker_service }}"
        enabled: true
        state: started
        daemon_reload: true
      tags: [worker]

    - name: Assert image builder worker is active
      ansible.builtin.command:
        cmd: systemctl is-active {{ rhem_imagebuilder_worker_service }}
      register: rhem_worker_active
      changed_when: false
      tags: [verify]

    - name: Probe built-image registry tags endpoint
      ansible.builtin.uri:
        url: "{{ rhem_built_registry_scheme }}://{{ rhem_built_registry_host }}/v2/{{ rhem_imagebuild_dest_image }}/tags/list"
        validate_certs: "{{ not (rhem_built_registry_skip_tls_verify | bool) }}"
        status_code: [200, 401]
      register: rhem_built_registry_probe
      failed_when: false
      changed_when: false
      tags: [verify]

    - name: Summarise image build host checks
      ansible.builtin.debug:
        msg:
          - "Image builder worker: {{ rhem_worker_active.stdout | default('unknown') }}"
          - "Registry tags probe HTTP status: {{ rhem_built_registry_probe.status | default('skipped') }}"
      tags: [verify]

- name: Apply OCI repositories, ImageBuild, and ImagePromotion via RHEM API
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  collections:
    - flightctl.core
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_imagebuilds.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_flightctl_connection.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/vault.yml"
  module_defaults:
    flightctl.core.flightctl_resource:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"
    flightctl.core.flightctl_resource_info:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"
    flightctl.core.flightctl_image_builder:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"
    flightctl.core.flightctl_image_builder_info:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"

  pre_tasks:
    - name: Require vault registry secrets for OCI Repository apply
      ansible.builtin.assert:
        that:
          - rhem_registry_username is defined
          - rhem_registry_password is defined
          - rhem_registry_username != 'CHANGEME'
          - rhem_registry_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_registry_username and rhem_registry_password in vault.yml
          (same credentials as registry.redhat.io podman login).
      tags: [always]

    - name: Require vault secret for RHEM API login
      ansible.builtin.assert:
        that:
          - rhem_pam_password is defined
          - rhem_pam_password | length > 0
          - rhem_pam_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_pam_password in inventory/group_vars/rhem_servers/vault.yml.
      tags: [always]

    - name: Assert promotion is not enabled without build completion wait
      ansible.builtin.assert:
        that:
          - not (rhem_imagebuild_promotion_enabled | bool) or (rhem_imagebuild_wait_complete | bool)
        fail_msg: >-
          Set rhem_imagebuild_wait_complete: true when rhem_imagebuild_promotion_enabled is true,
          or run a build to completion before the promotion tag.
      tags: [always]

  tasks:
    - name: Apply Red Hat OCI Repository via API
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_render_and_apply.yml"
      vars:
        rhem_flightctl_apply_template: "{{ playbook_dir }}/../templates/imagebuilds/repository-redhat-io.yaml.j2"
        rhem_flightctl_apply_secret: true
      when: rhem_imagebuild_apply_repositories | bool
      tags: [repositories]

    - name: Apply built-image OCI Repository via API
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_render_and_apply.yml"
      vars:
        rhem_flightctl_apply_template: "{{ playbook_dir }}/../templates/imagebuilds/repository-built.yaml.j2"
      when: rhem_imagebuild_apply_repositories | bool
      tags: [repositories]

    - name: Apply ImageBuild via API
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_render_and_apply.yml"
      vars:
        rhem_flightctl_apply_template: "{{ playbook_dir }}/../templates/imagebuilds/imagebuild.yaml.j2"
      when: rhem_imagebuild_apply_build | bool
      tags: [imagebuild]

    - name: Wait for ImageBuild completion
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_wait_imagebuild.yml"
      when:
        - rhem_imagebuild_apply_build | bool
        - rhem_imagebuild_wait_complete | bool
      tags: [imagebuild]

    - name: Assert ImageBuild completed before catalog promotion
      flightctl.core.flightctl_image_builder_info:
        kind: ImageBuild
        name: "{{ rhem_imagebuild_name }}"
      register: rhem_imagebuild_precheck
      changed_when: false
      failed_when: >-
        rhem_imagebuild_precheck.result.data | default([]) | length == 0
        or (
          rhem_imagebuild_precheck.result.data[0].status.conditions
          | default([])
          | selectattr('type', 'equalto', 'Ready')
          | list | length == 0
        )
        or (
          rhem_imagebuild_precheck.result.data[0].status.conditions
          | selectattr('type', 'equalto', 'Ready')
          | list | first
        ).reason != 'Completed'
      when:
        - rhem_imagebuild_apply_promotion | bool
        - not rhem_imagebuild_wait_complete | bool
      tags: [promotion]

    - name: Apply ImagePromotion to Software Catalog via API
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_render_and_apply.yml"
      vars:
        rhem_flightctl_apply_template: "{{ playbook_dir }}/../templates/imagebuilds/imagepromotion.yaml.j2"
      when: rhem_imagebuild_apply_promotion | bool
      tags: [promotion]

    - name: Wait for ImagePromotion completion
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_wait_imagepromotion.yml"
      when:
        - rhem_imagebuild_apply_promotion | bool
        - rhem_imagepromotion_wait_complete | bool
      tags: [promotion]

    - name: List OCI Repository resources
      flightctl.core.flightctl_resource_info:
        kind: Repository
      register: rhem_flightctl_repositories
      tags: [verify]

    - name: Get ImageBuild resource
      flightctl.core.flightctl_image_builder_info:
        kind: ImageBuild
        name: "{{ rhem_imagebuild_name }}"
      register: rhem_flightctl_imagebuild
      failed_when: false
      tags: [verify]

    - name: Get ImagePromotion when catalog promotion enabled
      flightctl.core.flightctl_resource_info:
        kind: ImagePromotion
        name: "{{ rhem_imagepromotion_name }}"
      register: rhem_flightctl_imagepromotion
      failed_when: false
      when: rhem_imagebuild_promotion_enabled | bool
      tags: [verify]

    - name: List catalog items when catalog promotion enabled
      flightctl.core.flightctl_resource_info:
        kind: CatalogItem
        catalog_name: "{{ rhem_catalog_name }}"
      register: rhem_flightctl_catalogitems
      failed_when: false
      when: rhem_imagebuild_promotion_enabled | bool
      tags: [verify]

    - name: Summarise image build API result
      ansible.builtin.debug:
        msg:
          - "ImageBuild: {{ rhem_imagebuild_name }} → {{ rhem_built_registry_host }}/{{ rhem_imagebuild_dest_image }}:{{ rhem_imagebuild_dest_tag }}"
          - "Catalog promotion: {{ 'enabled (' ~ rhem_imagepromotion_name ~ ')' if rhem_imagebuild_promotion_enabled | bool else 'disabled' }}"
          - "Repositories in API: {{ rhem_flightctl_repositories.result.data | default([]) | map(attribute='metadata') | map(attribute='name') | list }}"
      tags: [verify]