---
# Advanced bootc image: Containerfile, podman build/push, CatalogItem (no ImageBuild).
# Catalog registration uses flightctl.core on localhost — no flightctl apply.
# Prerequisites: rhem-install-rpm.yml; OCI built registry from rhem-image-builds.yml (repositories tag).

- name: Advanced bootc build on RHEM host
  hosts: rhem_servers
  become: true
  gather_facts: false

  pre_tasks:
    - name: Require vault registry secrets
      ansible.builtin.assert:
        that:
          - rhem_registry_username is defined
          - rhem_registry_password is defined
          - rhem_registry_username != 'CHANGEME'
          - rhem_registry_password != 'CHANGEME'
        fail_msg: >-
          Set registry credentials in vault.yml (registry.redhat.io login).
      tags: [always]

    - name: Require vault secret for QCOW2 config.toml user password
      ansible.builtin.assert:
        that:
          - rhem_advanced_qcow2_user_password is defined
          - rhem_advanced_qcow2_user_password | length > 0
          - rhem_advanced_qcow2_user_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_advanced_qcow2_user_password in vault.yml for bootc-image-builder config.toml.
      when:
        - rhem_advanced_qcow2_enabled | bool
        - rhem_advanced_qcow2_config_enabled | bool
      tags: [always]

  tasks:
    - name: Enable Edge Manager content repository on build host
      community.general.rhsm_repository:
        name: "{{ rhem_rhsm_repo_id }}"
        state: enabled
      tags: [prereq]

    - name: Log in to Red Hat container registry
      containers.podman.podman_login:
        registry: "{{ rhem_registry_url }}"
        username: "{{ rhem_registry_username }}"
        password: "{{ rhem_registry_password }}"
      no_log: true
      tags: [prereq]

    - name: Install lab registry drop-in for Podman
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/advancedbuilds/registries-micro-lan-lab.conf.j2"
        dest: "{{ rhem_lab_registry_dropin_path }}"
        owner: root
        group: root
        mode: "0644"
      tags: [prereq]

    - name: Check for existing flightctl client configuration
      ansible.builtin.stat:
        path: "{{ rhem_flightctl_client_config }}"
      register: rhem_flightctl_client_stat
      when: rhem_flightctl_login_enabled | bool
      tags: [earlybinding]

    - name: Build flightctl login argument list
      ansible.builtin.set_fact:
        rhem_flightctl_login_argv: >-
          {{ _rhem_flightctl_login_base + (['--insecure-skip-tls-verify'] if rhem_flightctl_login_insecure_tls | bool else []) }}
      vars:
        _rhem_flightctl_login_base:
          - flightctl
          - login
          - "https://{{ rhem_fqdn }}"
          - --username
          - "{{ rhem_pam_username }}"
          - --password
          - "{{ rhem_pam_password }}"
      when: rhem_flightctl_login_enabled | bool
      no_log: true
      tags: [earlybinding]

    - name: Log in flightctl CLI on RHEM host when needed
      ansible.builtin.command:
        argv: "{{ rhem_flightctl_login_argv }}"
      when:
        - rhem_flightctl_login_enabled | bool
        - not rhem_flightctl_client_stat.stat.exists | default(false)
      no_log: true
      tags: [earlybinding]

    - name: Ensure advanced build context directory exists
      ansible.builtin.file:
        path: "{{ rhem_advanced_build_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      tags: [earlybinding, context]

    - name: Check for existing enrollment config in build context
      ansible.builtin.stat:
        path: "{{ rhem_advanced_build_dir }}/config.yaml"
      register: rhem_advanced_config_stat
      when: rhem_advanced_early_binding | bool
      tags: [earlybinding]

    - name: Request enrollment certificate for early binding
      ansible.builtin.shell:
        cmd: >-
          flightctl certificate request --signer=enrollment
          --expiration={{ rhem_advanced_enrollment_cert_expiration }} --output=embedded
          > config.yaml
        chdir: "{{ rhem_advanced_build_dir }}"
      when:
        - rhem_advanced_early_binding | bool
        - rhem_advanced_regenerate_enrollment_cert | bool or not rhem_advanced_config_stat.stat.exists | default(false)
      tags: [earlybinding]

    - name: Render Containerfile into build context
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/advancedbuilds/Containerfile.j2"
        dest: "{{ rhem_advanced_build_dir }}/Containerfile"
        owner: root
        group: root
        mode: "0644"
      tags: [context]

    - name: Build advanced bootc image with Podman
      ansible.builtin.command:
        cmd: podman build -t {{ rhem_advanced_oci_image_ref }} .
        chdir: "{{ rhem_advanced_build_dir }}"
      async: "{{ rhem_advanced_build_async_timeout if rhem_advanced_build_async | bool else 0 }}"
      poll: "{{ rhem_advanced_build_poll if rhem_advanced_build_async | bool else 0 }}"
      tags: [build]

    - name: Push advanced bootc image to lab registry
      ansible.builtin.command:
        cmd: podman push {{ rhem_advanced_oci_image_ref }}
      tags: [push]

    - name: Ensure QCOW2 output directory exists
      ansible.builtin.file:
        path: "{{ rhem_advanced_qcow2_output_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: rhem_advanced_qcow2_enabled | bool
      tags: [qcow2]

    - name: Render bootc-image-builder config.toml
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/advancedbuilds/config.toml.j2"
        dest: "{{ rhem_advanced_build_dir }}/config.toml"
        owner: root
        group: root
        mode: "0600"
      when:
        - rhem_advanced_qcow2_enabled | bool
        - rhem_advanced_qcow2_config_enabled | bool
      no_log: true
      tags: [qcow2]

    - name: Pull bootc-image-builder container image
      ansible.builtin.command:
        cmd: podman pull {{ rhem_advanced_bib_image }}
      changed_when: true
      when: rhem_advanced_qcow2_enabled | bool
      tags: [qcow2]

    - name: Build bootc-image-builder argument list
      ansible.builtin.set_fact:
        rhem_advanced_bib_argv: >-
          {{
            [
              'podman', 'run', '--rm', '--privileged', '--pull=newer',
              '--security-opt', 'label=type:unconfined_t',
              '-v', '/var/lib/containers/storage:/var/lib/containers/storage:Z',
              '-v', rhem_advanced_build_dir ~ '/config.toml:/config.toml:Z',
              '-v', rhem_advanced_qcow2_output_dir ~ ':/output:Z',
              rhem_advanced_bib_image,
              '--type', 'qcow2',
              '--config', '/config.toml',
              rhem_advanced_oci_image_ref,
            ]
            if rhem_advanced_qcow2_config_enabled | bool
            else [
              'podman', 'run', '--rm', '--privileged', '--pull=newer',
              '--security-opt', 'label=type:unconfined_t',
              '-v', '/var/lib/containers/storage:/var/lib/containers/storage:Z',
              '-v', rhem_advanced_qcow2_output_dir ~ ':/output:Z',
              rhem_advanced_bib_image,
              '--type', 'qcow2',
              rhem_advanced_oci_image_ref,
            ]
          }}
      when: rhem_advanced_qcow2_enabled | bool
      tags: [qcow2]

    - name: Build QCOW2 disk image with bootc-image-builder
      ansible.builtin.command:
        argv: "{{ rhem_advanced_bib_argv }}"
      async: "{{ rhem_advanced_qcow2_bib_async_timeout if rhem_advanced_qcow2_bib_async | bool else 0 }}"
      poll: "{{ rhem_advanced_qcow2_bib_poll if rhem_advanced_qcow2_bib_async | bool else 0 }}"
      when: rhem_advanced_qcow2_enabled | bool
      tags: [qcow2]

    - name: Assert QCOW2 disk image exists
      ansible.builtin.stat:
        path: "{{ rhem_advanced_qcow2_disk_path }}"
      register: rhem_advanced_qcow2_stat
      when: rhem_advanced_qcow2_enabled | bool
      tags: [qcow2, verify]

    - name: Verify QCOW2 disk image was created
      ansible.builtin.assert:
        that:
          - rhem_advanced_qcow2_stat.stat.exists | default(false)
          - rhem_advanced_qcow2_stat.stat.size | default(0) > 0
        fail_msg: >-
          Expected QCOW2 at {{ rhem_advanced_qcow2_disk_path }} after bootc-image-builder.
      when: rhem_advanced_qcow2_enabled | bool
      tags: [qcow2, verify]

    - name: List local advanced image
      ansible.builtin.command:
        cmd: podman images {{ rhem_advanced_oci_image_ref }}
      register: rhem_advanced_podman_images
      changed_when: false
      failed_when: false
      tags: [verify]

    - name: Probe lab registry tags for advanced image
      ansible.builtin.uri:
        url: "{{ rhem_built_registry_scheme }}://{{ rhem_built_registry_host }}/v2/{{ rhem_advanced_dest_image }}/tags/list"
        validate_certs: "{{ not (rhem_built_registry_skip_tls_verify | bool) }}"
        status_code: [200, 401]
      register: rhem_advanced_registry_probe
      failed_when: false
      changed_when: false
      tags: [verify]

    - name: Summarise advanced build on host
      ansible.builtin.debug:
        msg:
          - "Advanced image: {{ rhem_advanced_oci_image_ref }}"
          - "QCOW2 disk: {{ rhem_advanced_qcow2_disk_path if rhem_advanced_qcow2_enabled | bool else 'disabled' }}"
          - "Registry tags probe HTTP status: {{ rhem_advanced_registry_probe.status | default('skipped') }}"
      tags: [verify]

- name: Register advanced image in Software Catalog via RHEM API
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  collections:
    - flightctl.core
  vars_files:
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_imagebuilds.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_advanced_imagebuilds.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/rhem_flightctl_connection.yml"
    - "{{ playbook_dir }}/../inventory/group_vars/rhem_servers/vault.yml"
  module_defaults:
    flightctl.core.flightctl_resource:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"
    flightctl.core.flightctl_resource_info:
      flightctl_host: "{{ rhem_flightctl_connection.flightctl_host }}"
      flightctl_username: "{{ rhem_flightctl_connection.flightctl_username }}"
      flightctl_password: "{{ rhem_flightctl_connection.flightctl_password }}"
      flightctl_validate_certs: "{{ rhem_flightctl_connection.flightctl_validate_certs }}"

  pre_tasks:
    - name: Skip catalog API play when registration disabled
      ansible.builtin.meta: end_play
      when: not rhem_advanced_catalog_enabled | bool

    - name: Require vault secret for RHEM API login
      ansible.builtin.assert:
        that:
          - rhem_pam_password is defined
          - rhem_pam_password | length > 0
          - rhem_pam_password != 'CHANGEME'
        fail_msg: >-
          Set rhem_pam_password in inventory/group_vars/rhem_servers/vault.yml.
      tags: [always]

  tasks:
    - name: Register advanced OS CatalogItem via API
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../tasks/rhem_flightctl_render_and_apply.yml"
      vars:
        rhem_flightctl_apply_template: "{{ playbook_dir }}/../templates/advancedbuilds/catalogitem.yaml.j2"
        rhem_flightctl_apply_catalog_name: "{{ rhem_advanced_catalog_name }}"
      tags: [promotion, verify]

    - name: Get advanced CatalogItem
      flightctl.core.flightctl_resource_info:
        kind: CatalogItem
        catalog_name: "{{ rhem_advanced_catalog_name }}"
        name: "{{ rhem_advanced_catalog_item_name }}"
      register: rhem_advanced_catalogitem
      tags: [verify]

    - name: Summarise advanced catalog registration
      ansible.builtin.debug:
        msg:
          - "Catalog item: {{ rhem_advanced_catalog_item_name }} ({{ rhem_advanced_catalog_name }}) version {{ rhem_advanced_catalog_item_version }}"
      tags: [verify]